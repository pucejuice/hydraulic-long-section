<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stormwater Long Section Designer</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>

body{
background:#1e1e1e;
color:#ddd;
font-family:Arial;
margin:20px;
}

h1{color:#7fd6ff}

table{
border-collapse:collapse;
width:100%;
margin-top:10px;
}

td,th{
border:1px solid #444;
padding:4px;
font-size:12px;
}

input,select{
background:#222;
color:#eee;
border:1px solid #555;
width:90px;
}

button{
background:#333;
color:#eee;
border:1px solid #555;
padding:6px;
margin:2px;
}

svg{
background:#111;
border:1px solid #333;
}

.lowVel{background:#332200}
.highVel{background:#330000}

</style>
</head>

<body>

<h1>Stormwater Long Section Designer</h1>

<h3>Design Storm</h3>

Rainfall Depth (mm)
<input id="rainDepth" value="25">

Duration (minutes)
<input id="duration" value="5">

<button onclick="runHydrology()">Compute Runoff</button>
<button onclick="autoSize()">Auto Size Pipes</button>

<br><br>

<button onclick="addRow()">Add Pit</button>
<button onclick="solveHGL()">Solve HGL</button>
<button onclick="saveJSON()">Save JSON</button>
<button onclick="loadJSON()">Load JSON</button>
<button onclick="exportCSV()">Export CSV</button>
<button onclick="exportDXF()">Export DXF</button>

<input type="file" id="fileInput" style="display:none">

<table id="pipeTable">

<thead>

<tr>
<th>Chain</th>
<th>Ground RL</th>
<th>Invert RL</th>
<th>Length</th>
<th>Diameter</th>
<th>Material</th>
<th>n</th>

<th>Catchment m²</th>
<th>Imperv</th>

<th>Local Q</th>
<th>Cum Q</th>

<th>Slope</th>
<th>Velocity</th>

<th>Pit K</th>
</tr>

</thead>

<tbody></tbody>

</table>

<br>

<svg id="profile" width="1200" height="420"></svg>

<script>

/* ------------------- MATERIALS ------------------- */

const materials={
"PVC":0.009,
"HDPE":0.010,
"Ductile Iron":0.012,
"Concrete":0.013,
"Vitrified Clay":0.014
}

/* ------------------- PIPE SIZES ------------------- */

const diameters=[

90,
100,
150,
225,
300,
375,
450,
525,
600,
750,
900,
1050,
1200

]

/* ------------------- DATA ------------------- */

let pipes=[]

/* ------------------- ADD ROW ------------------- */

function addRow(){

pipes.push({

chain:0,
ground:0,
invert:0,
length:10,

diameter:150,
material:"PVC",
n:materials["PVC"],

area:0,
imperv:0,

localQ:0,
cumQ:0,

slope:0,
velocity:0,

k:0,

hgl:0

})

renderTable()

}

/* ------------------- TABLE ------------------- */

function renderTable(){

let tbody=document.querySelector("#pipeTable tbody")

tbody.innerHTML=""

pipes.forEach((p,i)=>{

let row=document.createElement("tr")

if(p.velocity<0.6)row.classList.add("lowVel")
if(p.velocity>5)row.classList.add("highVel")

row.innerHTML=`

<td><input value="${p.chain}" onchange="pipes[${i}].chain=this.value"></td>

<td><input value="${p.ground}" onchange="pipes[${i}].ground=this.value"></td>

<td><input value="${p.invert}" onchange="pipes[${i}].invert=this.value"></td>

<td><input value="${p.length}" onchange="pipes[${i}].length=this.value"></td>

<td><input value="${p.diameter}" onchange="pipes[${i}].diameter=this.value"></td>

<td>
<select onchange="setMaterial(${i},this.value)">
${Object.keys(materials).map(m=>`<option ${m==p.material?"selected":""}>${m}</option>`)}
</select>
</td>

<td>${p.n}</td>

<td><input value="${p.area}" onchange="pipes[${i}].area=this.value"></td>

<td><input value="${p.imperv}" onchange="pipes[${i}].imperv=this.value"></td>

<td>${p.localQ.toFixed(2)}</td>

<td>${p.cumQ.toFixed(2)}</td>

<td>${p.slope.toFixed(4)}</td>

<td>${p.velocity.toFixed(2)}</td>

<td><input value="${p.k}" onchange="pipes[${i}].k=this.value"></td>

`

tbody.appendChild(row)

})

drawProfile()

}

function setMaterial(i,m){

pipes[i].material=m
pipes[i].n=materials[m]

renderTable()

}

/* ------------------- HYDROLOGY ------------------- */

function runHydrology(){

let depth=parseFloat(document.getElementById("rainDepth").value)/1000

let duration=parseFloat(document.getElementById("duration").value)*60

pipes.forEach(p=>{

let C=p.imperv*0.9+(1-p.imperv)*0.2

let volume=depth*p.area*C

let Q=volume/duration

p.localQ=Q*1000

})

let cum=0

pipes.forEach(p=>{

cum+=p.localQ
p.cumQ=cum

})

renderTable()

}

/* ------------------- MANNING ------------------- */

function pipeCapacity(D,n,S){

let A=Math.PI*D*D/4

let R=D/4

let Q=(1/n)*A*Math.pow(R,2/3)*Math.sqrt(S)

return Q*1000

}

/* ------------------- AUTO SIZE ------------------- */

function autoSize(){

pipes.forEach((p,i)=>{

if(i>0){

let up=pipes[i-1]

let S=(up.invert-p.invert)/p.length

p.slope=S

for(let d of diameters){

let cap=pipeCapacity(d/1000,p.n,S)

if(cap>=p.cumQ){

p.diameter=d
break

}

}

let A=Math.PI*Math.pow(p.diameter/1000,2)/4

p.velocity=(p.cumQ/1000)/A

}

})

renderTable()

}

/* ------------------- HGL ------------------- */

function solveHGL(){

pipes.forEach((p,i)=>{

if(i==0){

p.hgl=p.invert+1

}else{

let up=pipes[i-1]

let V=p.velocity

let g=9.81

let hf=(V*V)/(2*g)

let pitLoss=p.k*hf

p.hgl=up.hgl-hf-pitLoss

}

})

drawProfile()

}

/* ------------------- PROFILE ------------------- */

function drawProfile(){

const svg=d3.select("#profile")

svg.selectAll("*").remove()

if(pipes.length==0)return

let width=1200
let height=420

let chain=pipes.map(p=>+p.chain)

let invert=pipes.map(p=>+p.invert)
let ground=pipes.map(p=>+p.ground)
let hgl=pipes.map(p=>+p.hgl)

let x=d3.scaleLinear()
.domain(d3.extent(chain))
.range([60,width-40])

let y=d3.scaleLinear()
.domain([
d3.min(invert)-2,
d3.max(ground)+2
])
.range([height-40,40])

/* grid */

for(let i=0;i<10;i++){

svg.append("line")
.attr("x1",60)
.attr("x2",width-40)
.attr("y1",40+i*35)
.attr("y2",40+i*35)
.attr("stroke","#222")

}

/* ground */

let line=d3.line()
.x((d,i)=>x(chain[i]))
.y(d=>y(d))

svg.append("path")
.datum(ground)
.attr("d",line)
.attr("stroke","#7fd6ff")
.attr("fill","none")
.attr("stroke-width",2)

/* invert */

svg.append("path")
.datum(invert)
.attr("d",line)
.attr("stroke","#00ff9c")
.attr("fill","none")
.attr("stroke-width",2)

/* HGL */

svg.append("path")
.datum(hgl)
.attr("d",line)
.attr("stroke","#ffaa00")
.attr("fill","none")
.attr("stroke-width",2)

/* pit markers */

svg.selectAll("circle")
.data(pipes)
.enter()
.append("circle")
.attr("cx",d=>x(d.chain))
.attr("cy",d=>y(d.invert))
.attr("r",5)
.attr("fill","#fff")
.call(d3.drag()

.on("drag",(event,d)=>{

d.invert=y.invert(event.y)

renderTable()

})

)

/* labels */

svg.selectAll(".flow")
.data(pipes)
.enter()
.append("text")
.attr("x",d=>x(d.chain))
.attr("y",d=>y(d.invert)-10)
.attr("fill","#ffaa00")
.attr("font-size","10px")
.text(d=>d.cumQ.toFixed(1)+" L/s")

}

/* ------------------- SAVE JSON ------------------- */

function saveJSON(){

let data=JSON.stringify(pipes,null,2)

let blob=new Blob([data])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="longsection.json"

a.click()

}

/* ------------------- LOAD JSON ------------------- */

function loadJSON(){

document.getElementById("fileInput").click()

}

document.getElementById("fileInput").addEventListener("change",function(e){

let reader=new FileReader()

reader.onload=function(){

pipes=JSON.parse(reader.result)

renderTable()

}

reader.readAsText(e.target.files[0])

})

/* ------------------- CSV ------------------- */

function exportCSV(){

let csv="chain,ground,invert,diameter,flow\n"

pipes.forEach(p=>{

csv+=`${p.chain},${p.ground},${p.invert},${p.diameter},${p.cumQ}\n`

})

let blob=new Blob([csv])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="pipes.csv"

a.click()

}

/* ------------------- DXF ------------------- */

function exportDXF(){

let dxf=`0
SECTION
2
ENTITIES
`

pipes.forEach((p,i)=>{

if(i>0){

let p0=pipes[i-1]

dxf+=`
0
LINE
8
INVERT
10
${p0.chain}
20
${p0.invert}
11
${p.chain}
21
${p.invert}
`

}

})

dxf+=`
0
ENDSEC
0
EOF
`

let blob=new Blob([dxf])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="longsection.dxf"

a.click()

}

/* ------------------- INIT ------------------- */

addRow()
addRow()

</script>

</body>
</html>
