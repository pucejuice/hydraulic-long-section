<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stormwater Long Section Designer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>

body{
background:#111;
color:#ddd;
font-family:Arial;
margin:0;
}

#toolbar{
background:#222;
padding:10px;
border-bottom:1px solid #444;
}

button,input,select{
background:#333;
color:#ddd;
border:1px solid #555;
padding:5px;
margin:3px;
}

table{
border-collapse:collapse;
width:100%;
font-size:12px;
margin-top:6px;
}

th,td{
border:1px solid #444;
padding:4px;
text-align:center;
}

svg{background:#181818}

.pipe{stroke:#66aaff;stroke-width:3}
.obvert{stroke:#3388ff;stroke-dasharray:5,3}
.water{stroke:#00ffff;stroke-width:2}
.hgl{stroke:#ffaa00;stroke-width:2;stroke-dasharray:6,4}
.ground{stroke:#44aa44;stroke-width:2}

.grid{stroke:#333;stroke-width:1}

.pit{stroke:#aaa;fill:none}

.handle{fill:#ff4444;cursor:pointer}

.label{fill:#ccc;font-size:11px}

.outlet{background:#003366}

</style>
</head>

<body>

<div id="toolbar">

Rainfall Depth (mm)
<input id="rainDepth" type="number" value="20">

Duration (min)
<input id="duration" type="number" value="5">

<button onclick="addPit()">Add Pit</button>
<button onclick="deletePit()">Delete Pit</button>

<button onclick="autosize()">Auto Size Pipes</button>
<button onclick="saveJSON()">Save</button>
<button onclick="loadJSON()">Load</button>
<button onclick="exportDXF()">Export DXF</button>

</div>

<svg id="chart" width="1200" height="450"></svg>

<h3>Pits</h3>
<table id="pitTable"></table>

<h3>Pipes</h3>
<table id="pipeTable"></table>

<h3>Hydraulic Results</h3>
<table id="resultTable"></table>

<script>

const width=1200
const height=450

const svg=d3.select("#chart")

const scaleX=d3.scaleLinear().range([80,width-40])
const scaleY=d3.scaleLinear().range([height-50,40])

const diameters=[0.09,0.1,0.15,0.225,0.3,0.375,0.45]

let pits=[
{id:0,type:"outlet",chain:0,ground:10,invert:8,area:0,imp:0},
{id:1,type:"junction",chain:40,ground:9.8,invert:7.8,area:400,imp:0.7},
{id:2,type:"junction",chain:80,ground:9.7,invert:7.6,area:300,imp:0.6}
]

let pipes=[
{from:2,to:1,d:0.225,n:0.013},
{from:1,to:0,d:0.225,n:0.013}
]

function runoff(area,imp){

let depth=document.getElementById("rainDepth").value/1000
let dur=document.getElementById("duration").value*60

return area*imp*depth/dur

}

function areaPartial(d,y){

let r=d/2
let theta=2*Math.acos((r-y)/r)

return r*r*(theta-Math.sin(theta))/2

}

function wettedPerimeter(d,y){

let r=d/2
let theta=2*Math.acos((r-y)/r)

return r*theta

}

function manning(A,R,S,n){

return (1/n)*A*Math.pow(R,2/3)*Math.sqrt(S)

}

function solveDepth(pipe,Q){

let d=pipe.d

for(let y=0.001;y<=d;y+=d/200){

let A=areaPartial(d,y)
let P=wettedPerimeter(d,y)
let R=A/P

let S=(pits[pipe.from].invert-pits[pipe.to].invert)/
Math.abs(pits[pipe.to].chain-pits[pipe.from].chain)

let q=manning(A,R,S,pipe.n)

if(q>=Q)return y

}

return d

}

function compute(){

let flows={}

pits.forEach(p=>{
flows[p.id]=runoff(p.area,p.imp)
})

pipes.forEach(p=>{

flows[p.to]+=flows[p.from]

})

let results=[]

pipes.forEach(p=>{

let Q=flows[p.from]

let y=solveDepth(p,Q)

let A=areaPartial(p.d,y)

let v=Q/A

let a=pits[p.from]
let b=pits[p.to]

let len=Math.abs(b.chain-a.chain)

let grade=(a.invert-b.invert)/len

results.push({
flow:Q,
depth:y,
velocity:v,
length:len,
grade
})

})

return results

}

function drawGrid(){

let xmin=d3.min(pits,d=>d.chain)
let xmax=d3.max(pits,d=>d.chain)

let ymin=d3.min(pits,d=>d.invert)-1
let ymax=d3.max(pits,d=>d.ground)+1

for(let x=xmin;x<=xmax;x+=10){

svg.append("line")
.attr("x1",scaleX(x))
.attr("x2",scaleX(x))
.attr("y1",scaleY(ymin))
.attr("y2",scaleY(ymax))
.attr("class","grid")

}

for(let y=ymin;y<=ymax;y+=0.5){

svg.append("line")
.attr("x1",scaleX(xmin))
.attr("x2",scaleX(xmax))
.attr("y1",scaleY(y))
.attr("y2",scaleY(y))
.attr("class","grid")

}

}

function draw(){

svg.selectAll("*").remove()

let results=compute()

scaleX.domain(d3.extent(pits,d=>d.chain))
scaleY.domain([d3.min(pits,d=>d.invert)-1,d3.max(pits,d=>d.ground)+1])

drawGrid()

let groundLine=d3.line()
.x(d=>scaleX(d.chain))
.y(d=>scaleY(d.ground))

svg.append("path")
.datum(pits)
.attr("d",groundLine)
.attr("class","ground")

pipes.forEach((p,i)=>{

let a=pits[p.from]
let b=pits[p.to]

let r=results[i]

let ws1=a.invert+r.depth
let ws2=b.invert+r.depth

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(a.invert))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(b.invert))
.attr("class","pipe")

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(a.invert+p.d))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(b.invert+p.d))
.attr("class","obvert")

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(ws1))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(ws2))
.attr("class","water")

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(ws1+0.05))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(ws2+0.05))
.attr("class","hgl")

})

pits.forEach(p=>{

svg.append("rect")
.attr("x",scaleX(p.chain)-6)
.attr("y",scaleY(p.ground))
.attr("width",12)
.attr("height",scaleY(p.invert)-scaleY(p.ground))
.attr("class","pit")

svg.append("circle")
.attr("cx",scaleX(p.chain))
.attr("cy",scaleY(p.invert))
.attr("r",5)
.attr("class","handle")
.call(d3.drag().on("drag",function(event){

p.invert=scaleY.invert(event.y)
draw()

}))

})

updateTables(results)

}

function addPit(){

let last=pits[pits.length-1]

let id=pits.length

pits.push({
id:id,
type:"junction",
chain:last.chain+40,
ground:last.ground-0.05,
invert:last.invert-0.05,
area:300,
imp:0.7
})

pipes.unshift({
from:id,
to:id-1,
d:0.225,
n:0.013
})

draw()

}

function deletePit(){

if(pits.length<=1)return

pits.pop()
pipes.shift()

draw()

}

function autosize(){

let results=compute()

pipes.forEach((p,i)=>{

let Q=results[i].flow

for(let d of diameters){

p.d=d

let y=solveDepth(p,Q)

if(y/d<0.8)break

}

})

draw()

}

function exportDXF(){

let dxf="0\nSECTION\n2\nENTITIES\n"

pipes.forEach(p=>{

let a=pits[p.from]
let b=pits[p.to]

dxf+=`0
LINE
8
PIPE_INVERT
10
${a.chain}
20
${a.invert}
11
${b.chain}
21
${b.invert}
`

})

dxf+="0\nENDSEC\n0\nEOF"

let blob=new Blob([dxf])

let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="long_section.dxf"
a.click()

}

draw()

</script>

</body>
</html>
