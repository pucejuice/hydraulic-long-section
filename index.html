<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stormwater Long Section Designer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>

body{
background:#111;
color:#ddd;
font-family:Arial;
margin:0;
}

#toolbar{
background:#222;
padding:10px;
border-bottom:1px solid #444;
}

button,input{
background:#333;
color:#ddd;
border:1px solid #555;
padding:5px;
margin:3px;
}

table{
border-collapse:collapse;
width:100%;
font-size:12px;
margin-top:6px;
}

th,td{
border:1px solid #444;
padding:4px;
text-align:center;
}

svg{
background:#181818;
}

.pipe{stroke:#66aaff;stroke-width:3}
.obvert{stroke:#3388ff;stroke-dasharray:5,3}
.water{stroke:#00ffff;stroke-width:2}
.hgl{stroke:#ffaa00;stroke-width:2;stroke-dasharray:6,4}
.ground{stroke:#44aa44;stroke-width:2}

.pit{stroke:#aaa;fill:none}

.handle{
fill:#ff4444;
cursor:pointer;
}

.label{
fill:#ccc;
font-size:11px;
}

</style>
</head>

<body>

<div id="toolbar">

Rainfall Depth (mm)
<input id="rainDepth" type="number" value="20">

Duration (min)
<input id="duration" type="number" value="5">

<button onclick="autosize()">Auto Size Pipes</button>
<button onclick="saveJSON()">Save</button>
<button onclick="loadJSON()">Load</button>
<button onclick="exportDXF()">Export DXF</button>

</div>

<svg id="chart" width="1200" height="450"></svg>

<h3>Pits</h3>
<table id="pitTable"></table>

<h3>Pipes</h3>
<table id="pipeTable"></table>

<h3>Hydraulic Results</h3>
<table id="resultTable"></table>

<script>

const width=1200
const height=450

const svg=d3.select("#chart")

const scaleX=d3.scaleLinear().range([80,width-40])
const scaleY=d3.scaleLinear().range([height-50,40])

const diameters=[0.09,0.1,0.15,0.225,0.3,0.375,0.45]

let pits=[
{id:0,chain:0,ground:10,invert:8,area:500,imp:0.8},
{id:1,chain:40,ground:9.8,invert:7.8,area:400,imp:0.7},
{id:2,chain:80,ground:9.7,invert:7.6,area:300,imp:0.6}
]

let pipes=[
{from:0,to:1,d:0.225,n:0.013},
{from:1,to:2,d:0.225,n:0.013}
]

function runoff(area,imp){

let depth=document.getElementById("rainDepth").value/1000
let dur=document.getElementById("duration").value*60

let vol=area*imp*depth
return vol/dur

}

function areaPartial(d,y){

let r=d/2
let theta=2*Math.acos((r-y)/r)

return r*r*(theta-Math.sin(theta))/2

}

function wettedPerimeter(d,y){

let r=d/2
let theta=2*Math.acos((r-y)/r)

return r*theta

}

function manning(A,R,S,n){

return (1/n)*A*Math.pow(R,2/3)*Math.sqrt(S)

}

function solveDepth(pipe,Q){

let d=pipe.d

for(let y=0.001;y<=d;y+=d/200){

let A=areaPartial(d,y)
let P=wettedPerimeter(d,y)
let R=A/P

let S=(pits[pipe.from].invert-pits[pipe.to].invert)/
(pits[pipe.to].chain-pits[pipe.from].chain)

let q=manning(A,R,S,pipe.n)

if(q>=Q) return y

}

return d

}

function compute(){

let results=[]
let flow=0

for(let i=pipes.length-1;i>=0;i--){

let p=pipes[i]

flow+=runoff(pits[p.from].area,pits[p.from].imp)

let y=solveDepth(p,flow)

let A=areaPartial(p.d,y)
let v=flow/A

let a=pits[p.from]
let b=pits[p.to]

let len=b.chain-a.chain
let grade=(a.invert-b.invert)/len

results.unshift({
flow,
depth:y,
velocity:v,
length:len,
grade
})

}

return results

}

function draw(){

svg.selectAll("*").remove()

let results=compute()

scaleX.domain(d3.extent(pits,d=>d.chain))
scaleY.domain([d3.min(pits,d=>d.invert)-1,d3.max(pits,d=>d.ground)+1])

let groundLine=d3.line()
.x(d=>scaleX(d.chain))
.y(d=>scaleY(d.ground))

svg.append("path")
.datum(pits)
.attr("d",groundLine)
.attr("class","ground")

pipes.forEach((p,i)=>{

let a=pits[p.from]
let b=pits[p.to]

let r=results[i]

let ws1=a.invert+r.depth
let ws2=b.invert+r.depth

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(a.invert))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(b.invert))
.attr("class","pipe")

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(a.invert+p.d))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(b.invert+p.d))
.attr("class","obvert")

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(ws1))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(ws2))
.attr("class","water")

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(ws1+0.05))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(ws2+0.05))
.attr("class","hgl")

svg.append("text")
.attr("x",(scaleX(a.chain)+scaleX(b.chain))/2)
.attr("y",scaleY(ws1)-5)
.text("WSE")
.attr("class","label")

svg.append("text")
.attr("x",(scaleX(a.chain)+scaleX(b.chain))/2)
.attr("y",scaleY(ws1+0.05)-5)
.text("HGL")
.attr("class","label")

})

pits.forEach(p=>{

svg.append("rect")
.attr("x",scaleX(p.chain)-6)
.attr("y",scaleY(p.ground))
.attr("width",12)
.attr("height",scaleY(p.invert)-scaleY(p.ground))
.attr("class","pit")

svg.append("circle")
.attr("cx",scaleX(p.chain))
.attr("cy",scaleY(p.invert))
.attr("r",5)
.attr("class","handle")
.call(d3.drag().on("drag",function(event){

p.invert=scaleY.invert(event.y)
draw()

}))

})

updateTables(results)

}

function updateTables(results){

let pitHTML="<tr><th>ID</th><th>Chain</th><th>Ground</th><th>Invert</th><th>Area</th><th>Imp</th></tr>"

pits.forEach((p,i)=>{

pitHTML+=`
<tr>
<td>${i}</td>
<td><input value="${p.chain}" onchange="pits[${i}].chain=this.value;draw()"></td>
<td><input value="${p.ground}" onchange="pits[${i}].ground=this.value;draw()"></td>
<td><input value="${p.invert}" onchange="pits[${i}].invert=this.value;draw()"></td>
<td><input value="${p.area}" onchange="pits[${i}].area=this.value;draw()"></td>
<td><input value="${p.imp}" onchange="pits[${i}].imp=this.value;draw()"></td>
</tr>`
})

document.getElementById("pitTable").innerHTML=pitHTML

let pipeHTML="<tr><th>Pipe</th><th>From</th><th>To</th><th>Dia mm</th><th>n</th></tr>"

pipes.forEach((p,i)=>{

pipeHTML+=`
<tr>
<td>${i}</td>
<td>${p.from}</td>
<td>${p.to}</td>
<td><input value="${p.d*1000}" onchange="pipes[${i}].d=this.value/1000;draw()"></td>
<td><input value="${p.n}" onchange="pipes[${i}].n=this.value;draw()"></td>
</tr>`
})

document.getElementById("pipeTable").innerHTML=pipeHTML

let resHTML="<tr><th>Pipe</th><th>Length</th><th>Grade</th><th>Flow</th><th>Velocity</th><th>Depth</th><th>y/D</th></tr>"

results.forEach((r,i)=>{

let p=pipes[i]

resHTML+=`
<tr>
<td>${i}</td>
<td>${r.length.toFixed(1)}</td>
<td>${r.grade.toFixed(4)}</td>
<td>${r.flow.toFixed(3)}</td>
<td>${r.velocity.toFixed(2)}</td>
<td>${r.depth.toFixed(3)}</td>
<td>${(r.depth/p.d).toFixed(2)}</td>
</tr>`
})

document.getElementById("resultTable").innerHTML=resHTML

}

function autosize(){

let flow=0

for(let i=pipes.length-1;i>=0;i--){

let p=pipes[i]

flow+=runoff(pits[p.from].area,pits[p.from].imp)

for(let d of diameters){

p.d=d

let y=solveDepth(p,flow)

if(y/d<0.8) break

}

}

draw()

}

function saveJSON(){

let blob=new Blob([JSON.stringify({pits,pipes})])

let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="storm_network.json"
a.click()

}

function loadJSON(){

let input=document.createElement("input")
input.type="file"

input.onchange=e=>{

let reader=new FileReader()

reader.onload=ev=>{

let d=JSON.parse(ev.target.result)

pits=d.pits
pipes=d.pipes

draw()

}

reader.readAsText(e.target.files[0])

}

input.click()

}

function exportDXF(){

let dxf="0\nSECTION\n2\nENTITIES\n"

pipes.forEach(p=>{

let a=pits[p.from]
let b=pits[p.to]

dxf+=`0
LINE
8
PIPE_INVERT
10
${a.chain}
20
${a.invert}
11
${b.chain}
21
${b.invert}
`

})

dxf+="0\nENDSEC\n0\nEOF"

let blob=new Blob([dxf])

let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="long_section.dxf"
a.click()

}

draw()

</script>

</body>
</html>
