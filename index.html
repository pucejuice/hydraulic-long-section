<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stormwater Long Section Designer</title>

<script src="https://d3js.org/d3.v7.min.js"></script>

<style>

body{
background:#111;
color:#ddd;
font-family:Arial;
margin:0;
}

#toolbar{
background:#222;
padding:10px;
border-bottom:1px solid #444;
}

button,input{
background:#333;
color:#ddd;
border:1px solid #555;
padding:5px;
margin:3px;
}

table{
border-collapse:collapse;
width:100%;
font-size:12px;
}

th,td{
border:1px solid #444;
padding:4px;
text-align:center;
}

svg{
background:#181818;
}

.pipe{
stroke:#66aaff;
stroke-width:3;
}

.obvert{
stroke:#3388ff;
stroke-dasharray:5,3;
}

.water{
stroke:#00ffff;
stroke-width:2;
}

.hgl{
stroke:#ff8800;
stroke-width:2;
stroke-dasharray:6,4;
}

.ground{
stroke:#44aa44;
stroke-width:2;
}

.pit{
stroke:#aaa;
fill:none;
}

.handle{
fill:#ff4444;
cursor:pointer;
}

</style>
</head>

<body>

<div id="toolbar">

Rainfall Depth (mm)
<input id="rainDepth" type="number" value="20">

Duration (min)
<input id="duration" type="number" value="5">

<button onclick="autosize()">Auto Size Pipes</button>
<button onclick="saveJSON()">Save</button>
<button onclick="loadJSON()">Load</button>
<button onclick="exportDXF()">Export DXF</button>

</div>

<svg id="chart" width="1200" height="500"></svg>

<h3 style="padding-left:10px">Pipe Table</h3>
<table id="table"></table>

<script>

const width=1200
const height=500

const svg=d3.select("#chart")

const scaleX=d3.scaleLinear().range([80,width-50])
const scaleY=d3.scaleLinear().range([height-50,40])

const diameters=[0.09,0.1,0.15,0.225,0.3,0.375,0.45]

const manning={
PVC:0.011,
CONCRETE:0.013
}

let pits=[
{id:0,chain:0,ground:10,invert:8,area:500,imp:0.8},
{id:1,chain:40,ground:9.8,invert:7.8,area:400,imp:0.7},
{id:2,chain:80,ground:9.7,invert:7.6,area:300,imp:0.6}
]

let pipes=[
{from:0,to:1,d:0.225,n:0.013},
{from:1,to:2,d:0.225,n:0.013}
]

function runoff(area,imp){

let depth=document.getElementById("rainDepth").value/1000
let dur=document.getElementById("duration").value*60

let vol=area*imp*depth
return vol/dur

}

function areaPartial(d,y){

let r=d/2
let theta=2*Math.acos((r-y)/r)

return r*r*(theta-Math.sin(theta))/2

}

function wettedPerimeter(d,y){

let r=d/2
let theta=2*Math.acos((r-y)/r)

return r*theta

}

function hydraulicRadius(A,P){

return A/P

}

function manningQ(A,R,S,n){

return (1/n)*A*Math.pow(R,2/3)*Math.sqrt(S)

}

function solveDepth(pipe,Q){

let d=pipe.d

for(let y=0.001;y<=d;y+=d/200){

let A=areaPartial(d,y)
let P=wettedPerimeter(d,y)
let R=hydraulicRadius(A,P)

let S=(pits[pipe.from].invert-pits[pipe.to].invert)/(pits[pipe.to].chain-pits[pipe.from].chain)

let q=manningQ(A,R,S,pipe.n)

if(q>=Q) return y

}

return d

}

function compute(){

let results=[]

let flow=0

for(let i=pipes.length-1;i>=0;i--){

let p= pipes[i]

flow+=runoff(pits[p.from].area,pits[p.from].imp)

let y=solveDepth(p,flow)

let A=areaPartial(p.d,y)
let v=flow/A

results.unshift({
flow,
depth:y,
velocity:v
})

}

return results

}

function autosize(){

let flow=0

for(let i=pipes.length-1;i>=0;i--){

let p=pipes[i]

flow+=runoff(pits[p.from].area,pits[p.from].imp)

for(let d of diameters){

p.d=d

let y=solveDepth(p,flow)

if(y/d<0.8) break

}

}

draw()

}

function draw(){

svg.selectAll("*").remove()

let results=compute()

scaleX.domain(d3.extent(pits,d=>d.chain))
scaleY.domain([d3.min(pits,d=>d.invert)-1,d3.max(pits,d=>d.ground)+1])

let groundLine=d3.line()
.x(d=>scaleX(d.chain))
.y(d=>scaleY(d.ground))

svg.append("path")
.datum(pits)
.attr("d",groundLine)
.attr("class","ground")

pipes.forEach((p,i)=>{

let a=pits[p.from]
let b=pits[p.to]

let y1=a.invert
let y2=b.invert

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(y1))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(y2))
.attr("class","pipe")

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(y1+p.d))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(y2+p.d))
.attr("class","obvert")

let r=results[i]

let ws1=y1+r.depth
let ws2=y2+r.depth

svg.append("line")
.attr("x1",scaleX(a.chain))
.attr("y1",scaleY(ws1))
.attr("x2",scaleX(b.chain))
.attr("y2",scaleY(ws2))
.attr("class","water")

})

pits.forEach(p=>{

svg.append("rect")
.attr("x",scaleX(p.chain)-6)
.attr("y",scaleY(p.ground))
.attr("width",12)
.attr("height",scaleY(p.invert)-scaleY(p.ground))
.attr("class","pit")

svg.append("circle")
.attr("cx",scaleX(p.chain))
.attr("cy",scaleY(p.invert))
.attr("r",5)
.attr("class","handle")
.call(d3.drag().on("drag",function(event){

p.invert=scaleY.invert(event.y)
draw()

}))

})

updateTable(results)

}

function updateTable(results){

let html="<tr><th>Pipe</th><th>Dia</th><th>Flow</th><th>Vel</th><th>Depth</th></tr>"

pipes.forEach((p,i)=>{

let r=results[i]

html+=`<tr>
<td>${i+1}</td>
<td>${(p.d*1000).toFixed(0)}</td>
<td>${r.flow.toFixed(3)}</td>
<td>${r.velocity.toFixed(2)}</td>
<td>${(r.depth/p.d).toFixed(2)}</td>
</tr>`

})

document.getElementById("table").innerHTML=html

}

function saveJSON(){

let data={pits,pipes}

let blob=new Blob([JSON.stringify(data)],{type:"application/json"})

let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="longsection.json"
a.click()

}

function loadJSON(){

let input=document.createElement("input")
input.type="file"

input.onchange=e=>{

let file=e.target.files[0]

let reader=new FileReader()

reader.onload=ev=>{

let d=JSON.parse(ev.target.result)

pits=d.pits
pipes=d.pipes

draw()

}

reader.readAsText(file)

}

input.click()

}

function exportDXF(){

let dxf="0\nSECTION\n2\nENTITIES\n"

pipes.forEach(p=>{

let a=pits[p.from]
let b=pits[p.to]

dxf+=`0
LINE
8
PIPE
10
${a.chain}
20
${a.invert}
11
${b.chain}
21
${b.invert}
`

})

dxf+="0\nENDSEC\n0\nEOF"

let blob=new Blob([dxf])

let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="longsection.dxf"
a.click()

}

draw()

</script>

</body>
</html>
